name: Saturday Tech News Bot

on:
  schedule:
    # Runs every Saturday at 9:00 AM Central Time (UTC-5 standard / UTC-6 daylight)    
    - cron: '0 9 * * 6'

  # Lets you click "Run workflow" manually in GitHub to test it
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python telegram_news_bot.py
