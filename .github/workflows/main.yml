name: First Monday Spiritual Message

on:
  schedule:
    - cron: '0 14 1-7 * 1'  # 8 AM Central Time (UTC-6 standard time)
  workflow_dispatch:       # lets you test it manually

jobs:
  send-spiritual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Send spiritual message
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # ← ADD THIS LINE
        run: python spiritual_bot.py
